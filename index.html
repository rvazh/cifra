<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14213D">
<title>CIFRA</title>
<style>
  :root {
    --papel: #EEF1F4;
    --tinta: #14213D;
    --verde: #1F6F5C;
    --linha: #C9D1DB;
    --suave: #55627A;
    --branco: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  [hidden] { display: none !important; }

  body {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 24px calc(24px + 20dvh);
    background: var(--papel);
    color: var(--tinta);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  }
  main { width: 100%; max-width: 360px; }

  .logo {
    display: block;
    width: min(198px, 56%);
    height: auto;
    margin: 0 auto 28px;
  }

  form { max-width: 280px; margin: 0 auto; }
  label { display: block; margin-bottom: 4px; font-size: .9rem; font-weight: 600; }
  input {
    width: 100%;
    margin-bottom: 14px;
    padding: 9px 12px;
    font: inherit;
    font-size: 1rem;
    color: var(--tinta);
    background: var(--branco);
    border: 1.5px solid var(--linha);
    border-radius: 6px;
  }
  button {
    width: 100%;
    padding: 10px;
    font: inherit;
    font-size: .95rem;
    font-weight: 700;
    color: var(--branco);
    background: var(--tinta);
    border: 0;
    border-radius: 6px;
    cursor: pointer;
  }
  button:active { background: #0C1530; }
  button.sair { margin-top: 24px; color: var(--tinta); background: transparent; border: 1.5px solid var(--tinta); }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--verde); outline-offset: 2px; }

  #boas-vindas { margin: 0; font-size: 1.5rem; font-weight: 700; }
  #aviso { margin: 8px 0 0; color: var(--suave); }
</style>
</head>

    <form id="form-login">
      <label for="usuario">Usuário</label>
      <input id="usuario" type="text" autocomplete="username" autocapitalize="none">

      <label for="senha">Senha</label>
      <input id="senha" type="password" autocomplete="current-password">

      <button type="submit">Entrar</button>
    </form>
  </section>

  <!-- Provisória: será substituída pela tela principal do app -->
  <section id="tela-inicio" hidden>
    <p id="boas-vindas"></p>
    <p id="aviso">A tela principal será criada no próximo passo.</p>
    <button type="button" class="sair" id="btn-sair">Sair</button>
  </section>
</main>

<script>
  const telaLogin = document.getElementById('tela-login');
  const telaInicio = document.getElementById('tela-inicio');
  const form = document.getElementById('form-login');
  const usuario = document.getElementById('usuario');
  const senha = document.getElementById('senha');

  // Sem validação: qualquer texto (ou nada) entra.
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    alert('Teste concluído');
    const nome = usuario.value.trim();
    document.getElementById('boas-vindas').textContent = nome ? 'Olá, ' + nome : 'Olá';
    telaLogin.hidden = true;
    telaInicio.hidden = false;
  });

  document.getElementById('btn-sair').addEventListener('click', () => {
    form.reset();
    telaInicio.hidden = true;
    telaLogin.hidden = false;
    usuario.focus();
  });
</script>
</body>
</html>
